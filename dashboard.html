<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeJournal - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
        .header h1 { color: #38bdf8; }
        .btn { padding: 0.6rem 1.2rem; border-radius: 6px; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        .btn-primary { background-color: #0284c7; color: white; }
        .btn-success { background-color: #16a34a; color: white; }
        .btn-danger { background-color: #dc2626; color: white; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; text-align: center; }
        .stat-card h3 { color: #94a3b8; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .stat-card p { font-size: 1.8rem; font-weight: bold; }
        
        /* Table Styles */
        .table-container { background: #1e293b; border-radius: 8px; border: 1px solid #334155; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 1rem; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; }
        .profit { color: #4ade80; }
        .loss { color: #f87171; }
        
        /* Modal Popup */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; width: 90%; max-width: 500px; }
        .modal-content h2 { margin-bottom: 1rem; color: #38bdf8; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
        .admin-badge { background: #16a34a; color: white; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; margin-left: 0.5rem; display: none; }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <div>
            <h1>TradeJournal <span id="admin-badge" class="admin-badge">ADMIN MODE</span></h1>
        </div>
        <div>
            <button id="admin-toggle-btn" class="btn btn-primary" onclick="toggleAdminModal()">Unlock Admin Mode</button>
            <button id="add-trade-btn" class="btn btn-success" style="display:none;" onclick="openTradeModal()">+ Add Trade</button>
            <button class="btn btn-danger" onclick="logout()">Lock Session</button>
        </div>
    </div>

    <!-- Summary Metrics -->
    <div class="stats-grid">
        <div class="stat-card"><h3>Total Trades</h3><p id="total-trades">0</p></div>
        <div class="stat-card"><h3>Win Rate</h3><p id="win-rate">0%</p></div>
        <div class="stat-card"><h3>Net PnL ($)</h3><p id="net-pnl">$0.00</p></div>
    </div>

    <!-- Trade History Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Asset</th>
                    <th>Type</th>
                    <th>Entry ($)</th>
                    <th>Exit ($)</th>
                    <th>PnL ($)</th>
                    <th id="actions-header" style="display:none;">Actions</th>
                </tr>
            </thead>
            <tbody id="trade-table-body">
                <!-- Trades will load dynamically here -->
            </tbody>
        </table>
    </div>

    <!-- Modal 1: Admin Token Entry -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <h2>Unlock Admin Mode</h2>
            <div class="form-group">
                <label>GitHub Fine-Grained Token:</label>
                <input type="password" id="github-token-input" placeholder="github_pat_..." />
            </div>
            <button class="btn btn-primary" onclick="saveAdminToken()">Authenticate</button>
            <button class="btn btn-danger" onclick="closeAdminModal()">Cancel</button>
        </div>
    </div>

    <!-- Modal 2: Add Trade -->
    <div id="trade-modal" class="modal">
        <div class="modal-content">
            <h2>Log New Trade</h2>
            <div class="form-group"><label>Date</label><input type="date" id="trade-date"></div>
            <div class="form-group"><label>Asset / Pair</label><input type="text" id="trade-asset" placeholder="e.g. BTC/USDT or EUR/USD"></div>
            <div class="form-group">
                <label>Type</label>
                <select id="trade-type"><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select>
            </div>
            <div class="form-group"><label>Entry Price ($)</label><input type="number" id="trade-entry" step="any"></div>
            <div class="form-group"><label>Exit Price ($)</label><input type="number" id="trade-exit" step="any"></div>
            <div class="form-group"><label>Profit / Loss ($)</label><input type="number" id="trade-pnl" step="any"></div>
            <button class="btn btn-success" onclick="saveTradeToGitHub()">Commit Trade to GitHub</button>
            <button class="btn btn-danger" onclick="closeTradeModal()">Cancel</button>
        </div>
    </div>

    <script>
        // Check session authentication from index.html
        if (sessionStorage.getItem("tj_authenticated") !== "true") {
            window.location.href = "index.html";
        }

        const GITHUB_USER = "smon14300";
        const REPO_NAME = "TradeJournal";
        let tradesData = [];
        let githubToken = sessionStorage.getItem("tj_github_token") || null;
        let fileSha = null;

        // Initialize Page
        window.onload = function() {
            if (githubToken) enableAdminUI();
            fetchTradesFromGitHub();
        };

        // Read-Only Fetch: No Token Needed!
        async function fetchTradesFromGitHub() {
            try {
                const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/trades.json?t=${new Date().getTime()}`;
                const response = await fetch(rawUrl);
                if(response.ok) {
                    tradesData = await response.json();
                    renderDashboard();
                }
            } catch(e) {
                console.error("Error fetching trades:", e);
            }
        }

        function renderDashboard() {
            const tableBody = document.getElementById("trade-table-body");
            tableBody.innerHTML = "";

            let totalPnL = 0;
            let wins = 0;

            tradesData.forEach((trade, index) => {
                totalPnL += parseFloat(trade.pnl || 0);
                if (parseFloat(trade.pnl) > 0) wins++;

                const row = document.createElement("tr");
                const pnlClass = parseFloat(trade.pnl) >= 0 ? "profit" : "loss";
                
                let actionTd = githubToken ? `<td><button class="btn btn-danger" onclick="deleteTrade(${index})">Delete</button></td>` : "";

                row.innerHTML = `
                    <td>${trade.date}</td>
                    <td>${trade.asset}</td>
                    <td>${trade.type}</td>
                    <td>$${trade.entry}</td>
                    <td>$${trade.exit}</td>
                    <td class="${pnlClass}">$${trade.pnl}</td>
                    ${actionTd}
                `;
                tableBody.appendChild(row);
            });

            // Calculate Metrics
            document.getElementById("total-trades").innerText = tradesData.length;
            const winRateVal = tradesData.length > 0 ? ((wins / tradesData.length) * 100).toFixed(1) : 0;
            document.getElementById("win-rate").innerText = `${winRateVal}%`;
            document.getElementById("net-pnl").innerText = `$${totalPnL.toFixed(2)}`;
            document.getElementById("net-pnl").className = totalPnL >= 0 ? "profit" : "loss";
        }

        // Admin Management
        function toggleAdminModal() { document.getElementById("admin-modal").style.display = "flex"; }
        function closeAdminModal() { document.getElementById("admin-modal").style.display = "none"; }
        function openTradeModal() { document.getElementById("trade-modal").style.display = "flex"; }
        function closeTradeModal() { document.getElementById("trade-modal").style.display = "none"; }

        function saveAdminToken() {
            const tokenInput = document.getElementById("github-token-input").value.trim();
            if (tokenInput) {
                githubToken = tokenInput;
                sessionStorage.setItem("tj_github_token", githubToken);
                enableAdminUI();
                closeAdminModal();
                fetchFileSha(); // Pre-fetch SHA for fast writing
            }
        }

        function enableAdminUI() {
            document.getElementById("admin-badge").style.display = "inline-block";
            document.getElementById("add-trade-btn").style.display = "inline-block";
            document.getElementById("actions-header").style.display = "table-cell";
            document.getElementById("admin-toggle-btn").innerText = "Admin Unlocked";
            renderDashboard();
        }

        async function fetchFileSha() {
            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/trades.json`;
            const response = await fetch(apiUrl, {
                headers: { "Authorization": `token ${githubToken}` }
            });
            if (response.ok) {
                const data = await response.json();
                fileSha = data.sha;
            }
        }

        async function saveTradeToGitHub() {
            const newTrade = {
                date: document.getElementById("trade-date").value,
                asset: document.getElementById("trade-asset").value,
                type: document.getElementById("trade-type").value,
                entry: document.getElementById("trade-entry").value,
                exit: document.getElementById("trade-exit").value,
                pnl: document.getElementById("trade-pnl").value
            };

            tradesData.push(newTrade);
            await pushTradesToGitHub("Add new trade via TradeJournal Admin");
            closeTradeModal();
        }

        async function deleteTrade(index) {
            if(confirm("Are you sure you want to delete this trade entry?")) {
                tradesData.splice(index, 1);
                await pushTradesToGitHub("Delete trade entry via TradeJournal Admin");
            }
        }

        async function pushTradesToGitHub(commitMessage) {
            if (!githubToken) return alert("Admin token missing!");
            await fetchFileSha(); // Get fresh SHA

            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/trades.json`;
            const updatedContent = btoa(JSON.stringify(tradesData, null, 2));

            const body = {
                message: commitMessage,
                content: updatedContent,
                sha: fileSha
            };

            const response = await fetch(apiUrl, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${githubToken}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });

            if (response.ok) {
                alert("Updated successfully on GitHub!");
                renderDashboard();
            } else {
                alert("Failed to commit to GitHub. Please check your token permissions.");
            }
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
